packages:
  - packages/*
  - examples/*
  - scripts
  - tools/*

catalog:
  '@types/node': ^24.13.3
  '@arethetypeswrong/cli': ^0.18.5
  '@eslint/js': ^10.0.1
  ai: ^6.0.209
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.5
  globals: ^17.8.0
  prettier: ^3.9.6
  tsup: ^8.5.1
  tsx: ^4.23.1
  typescript: ^5.9.3
  typescript-eslint: ^8.65.0
  vitest: ^4.1.10

allowBuilds:
  esbuild: true
  msw: true

shellEmulator: true

overrides:
  js-yaml: '>=4.2.0'
  esbuild: '>=0.28.1'

minimumReleaseAgeExclude:
  - '@mastra/core@1.46.0'
  - '@mastra/deployer@1.46.0'
  - '@mastra/libsql@1.14.1'
  - '@mastra/memory@1.21.1'
  - '@mastra/observability@1.15.1'
  - '@mastra/server@1.46.0'
  - mastra@1.15.1
